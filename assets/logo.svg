<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#152445"/>
      <stop offset="65%" stop-color="#0C1326"/>
      <stop offset="100%" stop-color="#070B16"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40F8FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A3C"/>
      <stop offset="55%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#D92B1B"/>
    </linearGradient>
    <linearGradient id="coreHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="rustGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded obsidian app-icon tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="#1E355E" stroke-width="6"/>

  <!-- Outer hexagonal compression chamber -->
  <polygon points="256,64 422,160 422,352 256,448 90,352 90,160"
           fill="#0A1122" fill-opacity="0.75" stroke="url(#cyanGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#cyanGlow)"/>

  <!-- Inner subtle structural hex -->
  <polygon points="256,112 380,184 380,328 256,400 132,328 132,184"
           fill="none" stroke="#1E3A5F" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Inward compression chevrons/vectors from 3 nodes -->
  <g stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#cyanGlow)">
    <!-- Top vector -->
    <line x1="256" y1="126" x2="256" y2="178"/>
    <polyline points="238,162 256,180 274,162"/>
    <!-- Bottom-left vector -->
    <line x1="146" y1="320" x2="191" y2="294"/>
    <polyline points="168,287 193,293 186,318"/>
    <!-- Bottom-right vector -->
    <line x1="366" y1="320" x2="321" y2="294"/>
    <polyline points="326,318 319,293 344,287"/>
  </g>

  <!-- Three glowing distributed compute nodes -->
  <g filter="url(#cyanGlow)">
    <circle cx="256" cy="104" r="24" fill="url(#cyanGrad)"/>
    <circle cx="256" cy="104" r="9" fill="#E0F7FF"/>
    <circle cx="126" cy="332" r="24" fill="url(#cyanGrad)"/>
    <circle cx="126" cy="332" r="9" fill="#E0F7FF"/>
    <circle cx="386" cy="332" r="24" fill="url(#cyanGrad)"/>
    <circle cx="386" cy="332" r="9" fill="#E0F7FF"/>
  </g>

  <!-- Center compressed luminous diamond prism core -->
  <g filter="url(#rustGlow)">
    <polygon points="256,178 334,256 256,334 178,256" fill="url(#rustGrad)"/>
    <!-- Facets for 3D crystal depth -->
    <polygon points="256,178 334,256 256,256" fill="#FFB26B" opacity="0.45"/>
    <polygon points="256,334 178,256 256,256" fill="#7C1308" opacity="0.45"/>
    <polygon points="256,210 302,256 256,302 210,256" fill="url(#coreHighlight)"/>
  </g>
</svg>
