<svg xmlns="http://www.w3.org/2000/svg" width="860" height="238" viewBox="0 0 860 238" role="img" aria-label="CrushGrid Distributed Compression Pipeline Architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#8B949E"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#22C55E"/>
    </marker>
    <marker id="arr-deny" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#F87171"/>
    </marker>
    <style>
      .card { fill: #161B22; stroke: #30363D; stroke-width: 1.25; }
      .sub  { fill: #0D1117; stroke: #30363D; stroke-width: 1.15; }
      .acc  { fill: #0C2D48; stroke: #38BDF8; stroke-width: 1.35; }
      .ok   { fill: #052E16; stroke: #22C55E; stroke-width: 1.35; }
      .deny { fill: #2A1215; stroke: #F87171; stroke-width: 1.35; }
      .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #E6EDF3; text-anchor: middle; }
      .tl   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #E6EDF3; text-anchor: start; }
      .b    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.6px; fill: #C9D1D9; text-anchor: middle; }
      .m    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; fill: #8B949E; text-anchor: middle; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.2px; font-weight: 600; fill: #7DD3FC; text-anchor: middle; }
      .ok-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.2px; font-weight: 700; fill: #86EFAC; text-anchor: middle; }
      .dn-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.2px; font-weight: 700; fill: #FCA5A5; text-anchor: middle; }
      .kicker { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.7px; fill: #7DD3FC; text-anchor: middle; }
      .e    { fill: none; stroke: #8B949E; stroke-width: 1.35; }
      .ea   { fill: none; stroke: #38BDF8; stroke-width: 1.45; }
      .eok  { fill: none; stroke: #22C55E; stroke-width: 1.45; }
      .edn  { fill: none; stroke: #F87171; stroke-width: 1.45; }
    </style>
  </defs>

  <!-- Node 1: Input -->
  <rect class="card" x="16" y="80" width="126" height="74" rx="9"/>
  <text class="kicker" x="79" y="100">SOURCE</text>
  <text class="t" x="79" y="120">Input Data</text>
  <text class="m" x="79" y="138">Files &amp; Directories</text>

  <line class="e" x1="142" y1="117" x2="174" y2="117" marker-end="url(#arr)"/>

  <!-- Node 2: Slab Classifier -->
  <rect class="card" x="178" y="72" width="154" height="90" rx="9"/>
  <text class="kicker" x="255" y="92">INGEST</text>
  <text class="t" x="255" y="112">Slab Classifier</text>
  <text class="m" x="255" y="130">BLAKE3 Slab Dedup</text>
  <text class="m" x="255" y="146">Per-Slab Codec Auto</text>

  <line class="e" x1="332" y1="117" x2="364" y2="117" marker-end="url(#arr)"/>

  <!-- Node 3: Credit Scheduler -->
  <rect class="acc" x="368" y="72" width="150" height="90" rx="9"/>
  <text class="kicker" x="443" y="92">COORDINATOR</text>
  <text class="t" x="443" y="112">Credit Scheduler</text>
  <text class="m" x="443" y="130">Pull Work-Stealing</text>
  <text class="m" x="443" y="146">AIMD + ByteBudget</text>

  <!-- Split connectors -->
  <path class="e" d="M 518,98 C 542,98 542,58 564,58" marker-end="url(#arr)"/>
  <path class="ea" d="M 518,136 C 542,136 542,176 564,176" marker-end="url(#arr-acc)"/>
  <text class="mono" x="518" y="198">AES-256-GCM</text>

  <!-- Node 4a: Local Pool -->
  <rect class="card" x="568" y="18" width="146" height="80" rx="9"/>
  <text class="kicker" x="641" y="37">LOCAL</text>
  <text class="t" x="641" y="56">Codec Pool</text>
  <text class="m" x="641" y="73">Zstd · Bzip3 · PPMd7</text>
  <text class="m" x="641" y="88">LZMA2+BCJ · LZ4</text>

  <!-- Node 4b: Remote Workers -->
  <rect class="card" x="568" y="136" width="146" height="80" rx="9"/>
  <text class="kicker" x="641" y="155">CLUSTER</text>
  <text class="t" x="641" y="174">Remote Workers</text>
  <text class="m" x="641" y="191">2 to 100+ Nodes</text>
  <text class="m" x="641" y="206">LAN · Tailscale · Cloud</text>

  <!-- Merge connectors -->
  <path class="e" d="M 714,58 C 734,58 734,102 748,102" marker-end="url(#arr)"/>
  <path class="ea" d="M 714,176 C 734,176 734,132 748,132" marker-end="url(#arr-acc)"/>

  <!-- Node 5: Archive Output -->
  <rect class="ok" x="752" y="72" width="92" height="90" rx="9"/>
  <text class="kicker" x="798" y="92">ARCHIVE</text>
  <text class="ok-t" x="798" y="113">.sqz v3</text>
  <text class="m" x="798" y="131">Seekable</text>
  <text class="m" x="798" y="147">O(1) Unpack</text>
</svg>
