<svg xmlns="http://www.w3.org/2000/svg" width="820" height="218" viewBox="0 0 820 218" role="img" aria-label="CrushGrid Distributed Compression Pipeline Architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#8B949E"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#38BDF8"/>
    </marker>
    <style>
      .box { fill: #161B22; stroke: #30363D; stroke-width: 1.3; rx: 8; }
      .box-acc { fill: #0C2D48; stroke: #38BDF8; stroke-width: 1.4; rx: 8; }
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #E6EDF3; text-anchor: middle; }
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.2px; fill: #8B949E; text-anchor: middle; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 9.8px; font-weight: 600; fill: #7DD3FC; text-anchor: middle; }
      .edge { fill: none; stroke: #8B949E; stroke-width: 1.4; }
      .edge-acc { fill: none; stroke: #38BDF8; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Node 1: Input -->
  <rect class="box" x="14" y="76" width="122" height="64" rx="8"/>
  <text class="t" x="75" y="102">Input Data</text>
  <text class="s" x="75" y="120">Files &amp; Directories</text>

  <!-- Arrow 1 -> 2 -->
  <line class="edge" x1="136" y1="108" x2="168" y2="108" marker-end="url(#arr)"/>

  <!-- Node 2: Scanner & Dedup -->
  <rect class="box" x="172" y="68" width="154" height="80" rx="8"/>
  <text class="t" x="249" y="96">Slab Classifier</text>
  <text class="s" x="249" y="114">BLAKE3 Dedup</text>
  <text class="s" x="249" y="130">Per-Slab Codec Auto</text>

  <!-- Arrow 2 -> 3 -->
  <line class="edge" x1="326" y1="108" x2="358" y2="108" marker-end="url(#arr)"/>

  <!-- Node 3: Scheduler -->
  <rect class="box-acc" x="362" y="68" width="142" height="80" rx="8"/>
  <text class="t" x="433" y="96">Credit Scheduler</text>
  <text class="s" x="433" y="114">Pull Work-Stealing</text>
  <text class="s" x="433" y="130">AIMD + ByteBudget</text>

  <!-- Split Arrows 3 -> Local & Remote -->
  <path class="edge" d="M 504,90 C 524,90 524,52 544,52" marker-end="url(#arr)"/>
  <path class="edge-acc" d="M 504,126 C 524,126 524,164 544,164" marker-end="url(#arr-acc)"/>
  <text class="lbl" x="498" y="176">AES-256-GCM</text>

  <!-- Node 4a: Local Pool -->
  <rect class="box" x="548" y="18" width="142" height="68" rx="8"/>
  <text class="t" x="619" y="45">Local Codec Pool</text>
  <text class="s" x="619" y="63">Zstd · Bzip3 · PPMd7</text>
  <text class="s" x="619" y="77">LZMA2+BCJ · LZ4</text>

  <!-- Node 4b: Remote Workers -->
  <rect class="box" x="548" y="130" width="142" height="68" rx="8"/>
  <text class="t" x="619" y="157">Remote Workers</text>
  <text class="s" x="619" y="175">2 to 100+ Nodes</text>
  <text class="s" x="619" y="189">LAN · Tailscale · Cloud</text>

  <!-- Merge Arrows -> Output -->
  <path class="edge" d="M 690,52 C 708,52 708,94 720,94" marker-end="url(#arr)"/>
  <path class="edge-acc" d="M 690,164 C 708,164 708,122 720,122" marker-end="url(#arr-acc)"/>

  <!-- Node 5: Output Archive -->
  <rect class="box-acc" x="724" y="68" width="84" height="80" rx="8"/>
  <text class="t" x="766" y="96">.sqz v3</text>
  <text class="s" x="766" y="114">Seekable</text>
  <text class="s" x="766" y="130">O(1) Unpack</text>
</svg>
