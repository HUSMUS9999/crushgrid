[package]
name = "squiz-archive"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Distributed multi-node compression and archival CLI (Zstd, Bzip3, PPMd, LZMA2+BCJ, LZ4) with BLAKE3 dedup and AES-256-GCM"
repository = "https://github.com/HUSMUS9999/squiz-archive"
keywords = ["compression", "distributed", "zstd", "bzip3", "lzma2"]
categories = ["compression", "command-line-utilities", "network-programming"]

[[bin]]
name = "squiz-archive"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
rayon = "1.10"
crossbeam-channel = "0.5"
socket2 = { version = "0.5", features = ["all"] }
sysinfo = "0.33"
libc = "0.2"
walkdir = "2.5"

# Compression codecs (libzstd, liblzma, libbzip3 statically bundled; ppmd & lz4 pure Rust)
zstd-safe = { version = "7.2", default-features = false, features = ["std", "arrays", "zstdmt"] }
xz2 = { version = "0.1", features = ["static"] }
bzip3 = { version = "0.13", default-features = false, features = ["bundled"] }
ppmd-rust = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }

# Cryptography and hashing
blake3 = { version = "1.5", features = ["rayon"] }
aes-gcm = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
